<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

.quiz-routine { display: flex; flex-direction: column; width: 100%; text-align: left; margin-top: 12px; }

<script>
function toggleMenu() {
const menu = document.getElementById('mobileMenu');
menu.classList.toggle('open');
}

// Scroll reveal (with fail-safes so content is never stuck invisible)
const revealEls = document.querySelectorAll('.reveal');
try {
if ('IntersectionObserver' in window) {
const io = new IntersectionObserver((entries) => {
entries.forEach(entry => {
if (entry.isIntersecting) {
entry.target.classList.add('in-view');
io.unobserve(entry.target);
}
});
}, { threshold: 0, rootMargin: '0px 0px -10% 0px' });
revealEls.forEach(el => io.observe(el));
} else {
revealEls.forEach(el => el.classList.add('in-view'));
}
} catch (err) {
revealEls.forEach(el => el.classList.add('in-view'));
}
setTimeout(() => {
revealEls.forEach(el => el.classList.add('in-view'));
}, 2500);
</script>

<script>
// ── FIND YOUR FIT QUIZ ──
(function () {
  const PRODUCTS = {
    before: {
      key: 'before',
      name: 'The Before',
      subtitle: 'Protective Mist — 100ml',
      price: '$38',
      blurb: "A lightweight, fragrance-free mist with organic aloe, oat extract, and ectoin, worn under normal clothing to help head off heat rash before it starts. Launching spring 2027.",
      pairReason: 'for everyday prevention'
    },
    after: {
      key: 'after',
      name: 'The After',
      subtitle: 'Daily Lotion',
      price: 'still perfecting our formula, price TBD',
      blurb: "A gentle, fragrance-free lotion for everyday use — light enough to apply daily, made to keep skin comfortable without a heavy feel.",
      pairReason: 'for daily upkeep between treatments'
    },
    cream: {
      key: 'cream',
      name: 'The Cream',
      subtitle: 'Cream',
      price: 'still perfecting our formula, price TBD',
      blurb: "A richer cream for the spots that turn rough or dry — elbows, knees, cheeks — built to sit on the skin longer and soften specific patches.",
      pairReason: 'for spot-treating rough patches'
    },
    oil: {
      key: 'oil',
      name: 'The Oil',
      subtitle: 'Oil',
      price: 'still perfecting our formula, price TBD',
      blurb: "A lightweight oil for skin that runs dry all over, worked in after a bath or whenever skin feels tight, to add moisture back without clogging.",
      pairReason: 'for all-over dryness'
    },
    wash: {
      key: 'wash',
      name: 'The Wash',
      subtitle: 'Wash',
      price: 'still perfecting our formula, price TBD',
      blurb: "A gentle, fragrance-free wash for bath time, made to clean without stripping a developing skin barrier.",
      pairReason: 'for gentle bath-time cleansing'
    },
    shield: {
      key: 'shield',
      name: 'The Shield',
      subtitle: 'Diaper Cream',
      price: 'still perfecting our formula, price TBD',
      blurb: "A preventative diaper cream that forms a light barrier against moisture and friction, keeping the diaper area comfortable between changes.",
      pairReason: 'for diaper area protection'
    }
  };

  const PRODUCT_ORDER = ['before', 'wash', 'after', 'shield', 'cream', 'oil'];
  const ROUTINE_THRESHOLD = 2;

  const AGE_POINTS = {
    newborn: { before: 1, cream: 1, shield: 1 },
    infant: {},
    toddler: { after: 1, wash: 1 }
  };

  const CONCERN_POINTS = {
    prevent: { before: 3 },
    routine: { after: 3 },
    patches: { cream: 3 },
    dryall: { oil: 3 },
    wash: { wash: 3 },
    diaper: { shield: 3 }
  };

  const SKIN_POINTS = {
    fine: { after: 2, before: 1 },
    smallpatches: { cream: 2 },
    verydry: { oil: 2 },
    heat: { before: 2 }
  };

  const CONTEXT_POINTS = {
    heat: { before: 2 },
    bath: { wash: 2 },
    spots: { cream: 2 },
    season: { oil: 2 }
  };

  function addPoints(target, source) {
    if (!source) return;
    Object.keys(source).forEach(function (k) {
      target[k] = (target[k] || 0) + source[k];
    });
  }

  function computeScores(s) {
    const scores = { before: 0, after: 0, cream: 0, oil: 0, wash: 0, shield: 0 };
    addPoints(scores, AGE_POINTS[s.age]);
    addPoints(scores, CONCERN_POINTS[s.concern]);
    addPoints(scores, SKIN_POINTS[s.skin]);
    addPoints(scores, CONTEXT_POINTS[s.context]);
    return scores;
  }

  function pickWinner(scores) {
    return PRODUCT_ORDER.reduce(function (best, key) {
      return scores[key] > scores[best] ? key : best;
    }, PRODUCT_ORDER[0]);
  }

  function pickRunnerUp(scores, winnerKey) {
    const rest = PRODUCT_ORDER.filter(function (k) { return k !== winnerKey; });
    const runner = rest.reduce(function (best, key) {
      return scores[key] > scores[best] ? key : best;
    }, rest[0]);
    const gap = scores[winnerKey] - scores[runner];
    if (scores[runner] > 0 && gap <= 2) return runner;
    return null;
  }

  function pickRoutineKeys(scores) {
    const included = PRODUCT_ORDER.filter(function (key) { return scores[key] >= ROUTINE_THRESHOLD; });
    if (included.length === 0) included.push(pickWinner(scores));
    return included;
  }

  function questionNumber(step, subject) {
    if (step === 1) return 1;
    if (step === 2) return 2;
    if (step === 3) return 3;
    if (step === 4) return subject === 'self' ? 3 : 4;
    if (step === 5) return subject === 'self' ? 4 : 5;
    if (step === 6) return subject === 'self' ? 5 : 6;
    return 0;
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  let state = { step: 0, mode: null, subject: null, age: null, concern: null, skin: null, context: null };

  function goTo(step, patch) {
    state = Object.assign({}, state, { step: step }, patch || {});
    render();
    const panel = document.getElementById('quizPanel');
    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function restart() {
    state = { step: 0, mode: null, subject: null, age: null, concern: null, skin: null, context: null };
    render();
  }

  function back() {
    const s = state;
    if (s.step === 1) { goTo(0); return; }
    if (s.step === 2) { goTo(1); return; }
    if (s.step === 3) { goTo(2); return; }
    if (s.step === 4) { goTo(s.subject === 'self' ? 2 : 3); return; }
    if (s.step === 5) { goTo(4); return; }
    if (s.step === 6) { goTo(5); return; }
  }

  function optionButton(label, field, value, next) {
    return '<button type="button" class="quiz-option" data-field="' + field + '" data-value="' + value + '" data-next="' + next + '">' + esc(label) + '</button>';
  }

  function backLink() {
    return '<div class="quiz-actions"><button type="button" class="quiz-link" data-action="back">Back</button></div>';
  }

  function progress(step, subject) {
    return '<p class="quiz-progress">Question ' + questionNumber(step, subject) + '</p>';
  }

  function render() {
    const s = state;
    const panel = document.getElementById('quizPanel');
    if (!panel) return;
    let html = '';

    if (s.step === 0) {
      html += '<h1 class="section-headline" style="margin-bottom:20px;">Find <em>your fit</em></h1>';
      html += '<p class="section-body" style="margin-bottom:32px;">A few short questions about your baby\'s skin — or your own — to match you with the right product, or a full routine.</p>';
      html += '<div class="quiz-cta"><button type="button" class="btn-primary" data-action="start">Start</button></div>';

    } else if (s.step === 1) {
      html += progress(1, s.subject);
      html += '<h2 class="section-headline">What are you<br><em>looking for?</em></h2>';
      html += '<div class="quiz-options">';
      html += optionButton('One product, for a specific concern', 'mode', 'single', 2);
      html += optionButton('A full routine, tailored to your answers', 'mode', 'line', 2);
      html += '</div>';
      html += backLink();

    } else if (s.step === 2) {
      html += progress(2, s.subject);
      html += '<h2 class="section-headline">Who is<br>this <em>for?</em></h2>';
      html += '<div class="quiz-options">';
      html += optionButton('My baby', 'subject', 'baby', 3);
      html += optionButton('Myself', 'subject', 'self', 4);
      html += '</div>';
      html += backLink();

    } else if (s.step === 3) {
      html += progress(3, s.subject);
      html += '<h2 class="section-headline">How old is<br><em>your baby?</em></h2>';
      html += '<div class="quiz-options">';
      html += optionButton('Newborn — 0 to 3 months', 'age', 'newborn', 4);
      html += optionButton('Infant — 3 to 12 months', 'age', 'infant', 4);
      html += optionButton('Toddler — 1 to 3 years', 'age', 'toddler', 4);
      html += '</div>';
      html += backLink();

    } else if (s.step === 4) {
      html += progress(4, s.subject);
      html += '<h2 class="section-headline">What\'s going on<br><em>right now?</em></h2>';
      html += '<div class="quiz-options">';
      html += optionButton('Nothing yet — building a preventive routine', 'concern', 'prevent', 5);
      html += optionButton('A gentle wash for bath time', 'concern', 'wash', 5);
      html += optionButton('Just want a gentle everyday moisturizer', 'concern', 'routine', 5);
      html += optionButton('Diaper rash protection', 'concern', 'diaper', 5);
      html += optionButton('Rough or dry patches in specific spots', 'concern', 'patches', 5);
      html += optionButton('Overall dry, flaky skin that needs deep nourishment', 'concern', 'dryall', 5);
      html += '</div>';
      html += backLink();

    } else if (s.step === 5) {
      const possessive = s.subject === 'self' ? 'your' : "your baby's";
      html += progress(5, s.subject);
      html += '<h2 class="section-headline">Which sounds most<br>like <em>' + esc(possessive) + ' skin?</em></h2>';
      html += '<div class="quiz-options">';
      html += optionButton('Generally fine, no real issues', 'skin', 'fine', 6);
      html += optionButton('Gets dry in small patches, not all over', 'skin', 'smallpatches', 6);
      html += optionButton('Very dry all over, feels tight or flaky', 'skin', 'verydry', 6);
      html += optionButton('Sweats easily or prone to heat rash', 'skin', 'heat', 6);
      html += '</div>';
      html += backLink();

    } else if (s.step === 6) {
      const isSelf = s.subject === 'self';
      const contextHeatLabel = isSelf ? 'Hot weather, sweat, or tight clothing' : 'Hot weather, car seat, or bundled up outside';
      const contextBathLabel = isSelf ? 'Right after a shower' : 'Right after bath time';
      const contextSpotsLabel = isSelf ? 'Elastic waistbands, elbows, or skin folds' : 'Diaper changes, elbows, or skin folds';
      html += progress(6, s.subject);
      html += '<h2 class="section-headline">When does it<br>usually <em>show up?</em></h2>';
      html += '<div class="quiz-options">';
      html += optionButton(contextHeatLabel, 'context', 'heat', 7);
      html += optionButton(contextBathLabel, 'context', 'bath', 7);
      html += optionButton(contextSpotsLabel, 'context', 'spots', 7);
      html += optionButton('Dry weather, indoor heat, or after swimming', 'context', 'season', 7);
      html += '</div>';
      html += backLink();

    } else if (s.step === 7) {
      const scores = computeScores(s);
      const isSelf = s.subject === 'self';
      const lineSubjectLabel = isSelf ? 'you' : 'your baby';

      if (s.mode === 'single') {
        const winnerKey = pickWinner(scores);
        const runnerKey = pickRunnerUp(scores, winnerKey);
        const winner = PRODUCTS[winnerKey];
        const runner = runnerKey ? PRODUCTS[runnerKey] : null;

        html += '<p class="quiz-progress">Your Match</p>';
        html += '<div class="quiz-result">';
        html += '<h2 class="quiz-result-name">' + esc(winner.name) + '</h2>';
        html += '<p class="quiz-result-meta">' + esc(winner.subtitle) + ' — ' + esc(winner.price) + '</p>';
        html += '<p class="quiz-result-blurb">' + esc(winner.blurb) + '</p>';
        html += '</div>';
        if (runner) {
          html += '<hr class="quiz-divider">';
          html += '<p class="quiz-pair">Worth adding: <strong>' + esc(runner.name) + '</strong>, ' + esc(runner.pairReason) + '.</p>';
        }
      } else {
        const routineKeys = pickRoutineKeys(scores);
        const routineItems = routineKeys.map(function (key, idx) {
          return Object.assign({ num: idx + 1 }, PRODUCTS[key]);
        });
        html += '<p class="quiz-progress">Your Routine</p>';
        html += '<h2 class="section-headline">Your routine,<br>for <em>' + esc(lineSubjectLabel) + '</em></h2>';
        html += '<p class="section-body" style="margin-bottom:0;">' + (routineItems.length > 1 ? 'Based on your answers, these work well together, in this order:' : 'Based on your answers, this is the one to start with:') + '</p>';
        html += '<div class="quiz-routine">';
        routineItems.forEach(function (item) {
          html += '<div class="quiz-routine-item">';
          html += '<span class="quiz-routine-num">' + item.num + '</span>';
          html += '<div class="quiz-routine-body">';
          html += '<h3 class="quiz-routine-name">' + esc(item.name) + '</h3>';
          html += '<p class="quiz-routine-meta">' + esc(item.subtitle) + ' — ' + esc(item.price) + '</p>';
          html += '<p class="quiz-routine-blurb">' + esc(item.blurb) + '</p>';
          html += '</div>';
          html += '</div>';
        });
        html += '</div>';
      }

      html += '<div class="quiz-cta" style="margin-top:32px; gap:14px; flex-wrap:wrap;"><a href="index.html#waitlist" class="btn-primary">Join the Waitlist</a></div>';
      html += '<div class="quiz-actions"><button type="button" class="quiz-link" data-action="restart">Start over</button></div>';
    }

    panel.innerHTML = html;
  }

  document.addEventListener('click', function (e) {
    const optionEl = e.target.closest('.quiz-option');
    if (optionEl) {
      const field = optionEl.getAttribute('data-field');
      const value = optionEl.getAttribute('data-value');
      const next = parseInt(optionEl.getAttribute('data-next'), 10);
      const patch = {};
      patch[field] = value;
      goTo(next, patch);
      return;
    }
    const actionEl = e.target.closest('[data-action]');
    if (actionEl) {
      const action = actionEl.getAttribute('data-action');
      if (action === 'start') { goTo(1); }
      else if (action === 'back') { back(); }
      else if (action === 'restart') { restart(); }
    }
  });

  render();
})();
</script>

<script src="assets/cookie-consent.js"></script>

</body>
